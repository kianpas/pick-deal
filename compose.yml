name: pickdeal

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pickdeal}
      POSTGRES_USER: ${DB_USERNAME:-pickdeal}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1g
    shm_size: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
    image: pickdeal-backend:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-pickdeal}
      SPRING_PROFILES_ACTIVE: compose
      DB_USERNAME: ${DB_USERNAME:-pickdeal}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms128m -Xmx768m -XX:+ExitOnOutOfMemoryError}
      LOGGING_LEVEL_ORG_HIBERNATE_SQL: INFO
      PICKDEAL_COLLECTOR_SCHEDULING_ENABLED: ${COLLECTOR_ENABLED:-false}
      PICKDEAL_COLLECTOR_INGRESS_ENABLED: ${COLLECTOR_INGRESS_ENABLED:-false}
      PICKDEAL_COLLECTOR_INGRESS_TOKEN: ${COLLECTOR_INGRESS_TOKEN:-}
      PICKDEAL_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    # 공개 API 경계와 HTTPS 설정을 완료하기 전까지 호스트 내부에서만 접근한다.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    mem_limit: 1536m
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
