name: pickdeal

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pickdeal}
      POSTGRES_USER: ${DB_USERNAME:-pickdeal}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1g
    shm_size: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
    image: pickdeal-backend:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-pickdeal}
      SPRING_PROFILES_ACTIVE: compose
      DB_USERNAME: ${DB_USERNAME:-pickdeal}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms128m -Xmx768m -XX:+ExitOnOutOfMemoryError}
      LOGGING_LEVEL_ORG_HIBERNATE_SQL: INFO
      PICKDEAL_COLLECTOR_SCHEDULING_ENABLED: ${COLLECTOR_ENABLED:-false}
      PICKDEAL_COLLECTOR_INGRESS_ENABLED: ${COLLECTOR_INGRESS_ENABLED:-false}
      PICKDEAL_COLLECTOR_INGRESS_TOKEN: ${COLLECTOR_INGRESS_TOKEN:-}
      PICKDEAL_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      PICKDEAL_RETENTION_ENABLED: ${DEAL_RETENTION_ENABLED:-false}
      PICKDEAL_COLLECTOR_SOURCES_RULIWEB_ENABLED: "false"
      PICKDEAL_COLLECTOR_SOURCES_DOGDRIP_ENABLED: ${DOGDRIP_COLLECTOR_ENABLED:-false}
      PICKDEAL_COLLECTOR_SOURCES_COOLENJOY_ENABLED: ${COOLENJOY_COLLECTOR_ENABLED:-false}
      PICKDEAL_COLLECTOR_SOURCES_COOLENJOY_MAX_DETAIL_REQUESTS: ${COOLENJOY_MAX_DETAIL_REQUESTS:-3}
    # 공개 API 경계와 HTTPS 설정을 완료하기 전까지 호스트 내부에서만 접근한다.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
      # 운영 지표(actuator). reverse proxy로 넘기지 않고 서버 안에서만 조회한다.
      - "127.0.0.1:${MANAGEMENT_PORT:-8081}:8081"
    mem_limit: 1536m
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 운영 지표 저장·대시보드. monitoring 프로필을 켤 때만 실행한다(.env의 COMPOSE_PROFILES=monitoring).
  # 둘 다 인터넷에 공개하지 않고 호스트 127.0.0.1에만 연결해 SSH 터널로 접속한다(docs/06).
  prometheus:
    image: prom/prometheus:v3.13.4
    profiles: [monitoring]
    restart: unless-stopped
    depends_on:
      - backend
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 15일 또는 1GB 중 먼저 닿는 쪽까지만 보관한다.
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    # 시계열 약 2~3천 개 규모. 로컬 실측 시작 직후 약 33MiB.
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:13.2.3
    profiles: [monitoring]
    restart: unless-stopped
    depends_on:
      - prometheus
    # 필수값을 ${VAR:?}로 두면 프로필을 끈 배포까지 Compose 해석에 실패하므로, 시작할 때 검사한다.
    # 비어 있거나 기본값(admin)이면 Grafana를 띄우지 않는다.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        case "$$GF_SECURITY_ADMIN_PASSWORD" in
        ""|admin) echo "Set GRAFANA_ADMIN_PASSWORD in .env" >&2; exit 1;;
        esac;
        exec /run.sh
    environment:
      # 관리자 비밀번호는 Grafana DB 최초 생성 때만 적용된다. 이후 변경은 docs/06 절차를 따른다.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # 외부로 사용 통계·업데이트 확인·아바타 요청을 보내지 않는다.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GOMEMLIMIT: 480MiB
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    # 로컬 실측(2026-10-22): 시작 직후 약 245MiB, 대시보드 사용 후 최대 약 380MiB(프로세스 메모리 기준).
    # 384MiB 상한에서는 상한 도달이 반복돼 늘리고, Go 런타임이 상한 전에 메모리를 회수하도록 GOMEMLIMIT를 둔다.
    mem_limit: 640m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
