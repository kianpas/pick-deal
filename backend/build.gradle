plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.pickdeal'
version = '0.0.1-SNAPSHOT'

springBoot {
    mainClass = 'com.pickdeal.PickDealApplication'
}

// Spring을 기동하지 않는 독립 진단 프로그램 배포 파일.
tasks.register('diagnosticDist', Sync) {
    dependsOn tasks.named('classes')
    into layout.buildDirectory.dir('diagnostic')
    from(sourceSets.main.output) { into 'classes' }
    from(configurations.runtimeClasspath) { into 'lib' }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// 같은 코드/빌드에서 독립 실행점을 만든다. 운영 bootJar에는 수집기 전용 의존성을 넣지 않는다.
sourceSets {
    collector {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    test {
        compileClasspath += sourceSets.collector.output
        runtimeClasspath += sourceSets.collector.output
    }
}
configurations {
    collectorImplementation.extendsFrom implementation
    collectorRuntimeOnly.extendsFrom runtimeOnly
    testImplementation.extendsFrom collectorImplementation
    testRuntimeOnly.extendsFrom collectorRuntimeOnly
}
tasks.named('compileCollectorJava') { dependsOn tasks.named('classes') }
tasks.named('compileTestJava') { dependsOn tasks.named('collectorClasses') }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.register('collectorDist', Sync) {
    dependsOn tasks.named('collectorClasses')
    into layout.buildDirectory.dir('collector')
    from(sourceSets.main.output) { into 'classes' }
    from(sourceSets.collector.output) { into 'classes' }
    from(configurations.collectorRuntimeClasspath) { into 'lib' }
}

dependencies {
    collectorImplementation 'com.github.zhkl0228:impersonator-okhttp:1.10.2'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // 수집기: HTML 파싱 (docs/05 2장)
    implementation 'org.jsoup:jsoup:1.21.1'

    // Lombok: 버전은 Spring Boot 의존성 관리가 결정한다.
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
