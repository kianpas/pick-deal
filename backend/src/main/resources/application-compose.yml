# 새 Compose DB 전용. 기존 로컬 DB에는 이 프로필을 적용하지 않는다.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: false
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: validate

# 컨테이너 안에서는 모든 주소에서 받고, 호스트에는 compose.yml이 127.0.0.1로만 연결한다.
management:
  server:
    address: 0.0.0.0

pickdeal:
  read-only: true
  cors:
    allow-localhost: false
  seed:
    enabled: false

logging:
  level:
    org.hibernate.SQL: info
