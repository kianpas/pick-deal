spring:
  application:
    name: pick-deal-api
  flyway:
    enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:pickdeal}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: Asia/Seoul

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug

pickdeal:
  # 게시 시각 기준 보관 기간 정리. 기본 OFF, 매주 월요일 04:00(한국 시각) 실행.
  retention:
    enabled: false
    days: 90
    cron: "0 0 4 * * MON"
  collector:
    ingress:
      enabled: false
      token: ${COLLECTOR_INGRESS_TOKEN:}
    scheduling:
      enabled: true
    sources:
      coolenjoy:
        enabled: false
        timeout: 10s
        max-detail-requests: 3
      dogdrip:
        enabled: false
        timeout: 10s
        max-detail-requests: 3
      quasarzone:
        enabled: true
        timeout: 10s
        max-pages: 1
        max-items: 50
        bootstrap-max-pages: 3
        bootstrap-max-items: 150
        max-detail-requests: 3
      ruliweb:
        enabled: true
        timeout: 10s
        max-pages: 1
        max-items: 50
        bootstrap-max-pages: 3
        bootstrap-max-items: 150
        max-detail-requests: 3
