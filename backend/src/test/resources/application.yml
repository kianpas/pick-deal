# 테스트는 로컬 DB 없이 돌 수 있도록 H2 in-memory 유지 (AGENTS.md 빌드·테스트 규칙)
spring:
  application:
    name: pick-deal-api
  datasource:
    url: jdbc:h2:mem:pickdeal;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  jackson:
    time-zone: Asia/Seoul

# 테스트 중 실제 HTTP 수집이 돌지 않도록 스케줄러를 끈다
pickdeal:
  collector:
    scheduling:
      enabled: false
    # 일반 수집기 통합 테스트는 한 페이지 fixture만 사용한다. Bootstrap 범위는 전용 테스트에서 검증한다.
    sources:
      quasarzone:
        bootstrap-max-pages: 1
        bootstrap-max-items: 50
      ruliweb:
        bootstrap-max-pages: 1
        bootstrap-max-items: 50
