# PickDeal 운영 지표 수집 설정. compose.yml의 monitoring 프로필이 사용한다(docs/06 §5 지표 저장과 대시보드).
# 수집은 20분 주기이고 단일 사용자라 60초면 변화를 놓치지 않는다. 보관 기간·용량은 compose.yml의 실행 옵션에서 정한다.
global:
  scrape_interval: 60s
  scrape_timeout: 10s
  evaluation_interval: 60s

scrape_configs:
  # backend 관리 포트는 호스트에 127.0.0.1로만 연결되므로 Compose 내부 네트워크의 서비스 이름으로 접근한다.
  - job_name: pickdeal-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8081"]
