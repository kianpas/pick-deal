# deploy/grafana/dashboards의 JSON을 PickDeal 폴더에 자동으로 불러온다.
# 화면에서 바꾼 내용은 저장되지 않으므로 대시보드 수정은 JSON 파일로 한다.
apiVersion: 1

providers:
  - name: pickdeal
    folder: PickDeal
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/dashboards
