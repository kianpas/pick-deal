# Grafana 시작 시 자동 등록되는 데이터 소스. 화면에서 수정하지 않고 이 파일로 관리한다.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # Prometheus 수집 간격과 맞춰야 $__rate_interval이 올바른 구간을 고른다.
      timeInterval: 60s
